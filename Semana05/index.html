<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="description" content="Preencha">
<meta name="author" content="John Doe">


<title>Site inicial HTML5 por Fernando Luis Ferreira</title>

<!-- INFORMA AO CELULAR QUE NÃO DEVE MENTIR SOBRE SUA LARGURA E IMPEDE QUE A FONTE AUMENTE QUANDO O CELULAR É VIRADO DE LADO -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- FOLHAS DE ESTILO -->
<link href="css/normalize.css" rel="stylesheet">
<!-- celular padrão -->
<link href="css/pequeno.css" rel="stylesheet">
<!-- melhoria para tablet -->
<link href="css/medio.css" rel="stylesheet">
<!-- melhoria para desktop -->
<link href="css/grande.css" rel="stylesheet">
<script src="scripts/formulario.js" defer></script>
     
</head>
<body>
<!-- CABEÇALHO AQUI -->
	<header>
        <h1>Proposta de Curso</h1>
        <h2>Design de Formulários Web</h2>
    </header>
    
    
<!-- NAVEGAÇÃO AQUI -->
    <nav>
        <ul>
            <li><a href="#">Sobre</a></li>
            <li class="ativo"><a href="#">Propor</a></li>
            <li><a href="#">Vencedores</a></li>
            <li><a href="#">Contato</a></li>    
        </ul>
    </nav>
    
    
<!-- CONTEÚDO AQUI -->
<main>
    <h1>Formulário de Proposta de Curso</h1>
    <form method="GET" action="obrigado.html">
        <fieldset>
            <legend>Informações do Candidato</legend>
            <!--a tag label torna o campo ativo quando clicado e required torna o 
            o campo com preenchimento obrigatório-->
            <label>Nome:*<input type="text" name="nome" required></label>
            <label>Sobrenome:*<input type="text" name="sobrenome" required></label>
            <label>Telefone<input type="tel" name="fone" placeholder="1234567890"></label>
            <label>Email:*<input type="email" name="email" placeholder="alguem@gmail.com" required></label>
            <label>Website:<input type="url" name="url" placeholder="http://"></label>
        </fieldset>

        <fieldset>
            <legend>Informações do curso</legend>
            <div>Público-Alvo</div>
            <label><input type="radio" name="publico" value="iniciante">Iniciante</label>       
            <label><input type="radio" name="publico" value="intermediário">Intermediário</label>
            <label><input type="radio" name="publico" value="avançado">Avançado</label>

            <div>Software necessário</div>
            <label><input type="checkbox" name="edição" value="sim">Edição de Fotos</label>
            <label><input type="checkbox" name="programação" value="sim">Programação</label>
            <label><input type="checkbox" name="processador" value="sim">Pré-processador</label>
            <label><input type="checkbox" name="cliente" value="sim">Cliente FTP</label>
        </fieldset>

        <fieldset>
            <legend>Financiamento</legend>
            <label>Data prevista de conclusão <input type="date" name="data"></label>

            <label>Área do Curso
                <select name="tema">
                    <option value="">Selecione</option>>
                    <option value="criativo">Profissional criativo</option>
                    <option value="ti">Tecnologia da Informação</option>
                    <option value="data">Analista de dados</option>
                    <option value="construção">Construção</option>
                    <option value="manufatura">Manufatura</option>
                    <option value="negocios">Nrgócios</option>
                    <option value="segurança">Segutança Cibernética</option>

            </select> 
            <label>Quantidade de autores <input type="number" name="autores"></label>       
            </label>
        </fieldset>

        <input type="submit" value="Propor meu curso">




    </form>
</main>
    
<!-- RODAPÉ AQUI -->   
    <footer>
       <p>&copy; <span id="anoatual"></span> 🚀 Fernando Luis Ferreira   SP - Brasil 🚀 </p>
        <p id="ultimaModificacao"></p>
    </footer>

</body>
</html>
