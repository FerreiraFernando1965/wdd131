

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Projeto Criar um formulário responsivo em html, CSS e JavaScript,
   com avaliação do produto e página de agradecimento e confirmação">
  <meta name="author" content="Fernando Luis Ferreira">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Produto</title>
  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/formulario.js" defer></script>
</head>
<body>

  <header class="Avaliação">
    <h1>Avaliação do Produto</h1>
  </header>

  <main class="form-container">
    <form action="review.html" method="GET">

      <div class="form-grupo">
        <label for="produto">Nome do Produto</label>
        <select id="produto" name="produto" required>
          <option value="" disabled selected >"Selecione um produto..."</option>
        </select>
      </div>

      <div class="form-grupo">
        <span class="grupo-label">Classificação Geral</span>
        <div class="avaliação-grupo">
          <div class="avaliação-estrela">
            <label for="rating1" class="estrelas">☆</label>
            <input type="radio" id="rating1" name="classificacao" value="1" required>
          </div>
          <div class="avaliação-estrela">
            <label for="rating2" class="estrelas">☆☆</label>
            <input type="radio" id="rating2" name="classificacao" value="2" required>
          </div>
          <div class="avaliação-estrela">
            <label for="rating3" class="estrelas">☆☆☆</label>
            <input type="radio" id="rating3" name="classificacao" value="3" required>
          </div>
          <div class="avaliação-estrela">
            <label for="rating4" class="estrelas">☆☆☆☆</label>
            <input type="radio" id="rating4" name="classificacao" value="4" required>
          </div>
          <div class="avaliação-estrela">
            <label for="rating5" class="estrelas">☆☆☆☆☆</label>
            <input type="radio" id="rating5" name="classificacao" value="5" required>
          </div>
        </div>
      </div>

      <div class="form-grupo">
        <label for="data-instalacao">Data de Instalação</label>
        <input type="date" id="data-instalacao" name="dataInstalacao" required>
      </div>

      <div class="form-grupo">
        <span class="grupo-label">Recursos Úteis</span>
        <span class="sub-label">(Marque todos que se aplicam)</span>
        <div class="checkbox-grupo">
          <div class="checkbox-item">
            <input type="checkbox" id="durabilidade" name="recursos" value="Durabilidade">
            <label for="durabilidade">Durabilidade</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="facilidade" name="recursos" value="Facilidade de Uso">
            <label for="facilidade">Facilidade de Uso</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="desempenho" name="recursos" value="Desempenho">
            <label for="desempenho">Desempenho</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="design" name="recursos" value="Design">
            <label for="design">Design</label>
          </div>
        </div>
      </div>

      <div class="form-grupo">
        <label for="avaliacao-escrita">Avaliação Escrita <span class="opcional">(Opcional)</span></label>
        <textarea id="avaliacao-escrita" name="avaliacaoEscrita" rows="4"></textarea>
      </div>

      <div class="form-grupo">
        <label for="nome-usuario">Seu Nome <span class="opcional">(Opcional)</span></label>
        <input type="text" id="nome-usuario" name="nomeUsuario">
      </div>

      <input type="submit" id="btn-submit" name="btnSubmit" value="Publicar Avaliação" class="btn-submit">

    </form>
  </main>

  <footer>
    <p>&copy; <span id="anoatual"></span> 🚀 Fernando Luis Ferreira - Campinas SP-Brasil 🚀</p>
    <p id="ultimaModificacao"></p>
  </footer>

</body>
</html>
