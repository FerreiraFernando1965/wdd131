

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoMendes Pizzaria - Nosso Cardápio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="pizzaria.css">
    <script src="pizzaria.js" defer></script>
</head>
<body>

    <header class="header-site">
        <div class="logo-container">
            <h1>DoMendes</h1>
            <span>Pizzaria</span>
        </div>
        
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger-btn" aria-label="Abrir Menu">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="nav-menu">
            <ul>
                <li><a href="#" class="btn-filtro" data-categoria="todos">Todas</a></li>
                <li><a href="#" class="btn-filtro" data-categoria="salgada">Salgadas</a></li>
                <li><a href="#" class="btn-filtro" data-categoria="doce">Doces</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section id="cardapio" class="secao-cardapio">
            <h2 id="titulo-categoria">Nosso Cardápio</h2>
            
            <div class="filtros-cardapio">
                <button class="btn-filtro active" data-categoria="todos">Todas</button>
                <button class="btn-filtro" data-categoria="salgada">Salgadas</button>
                <button class="btn-filtro" data-categoria="doce">Doces</button>
            </div>
            
            <div id="grid-cardapio-dinamico" class="grid-cardapio">
                <!-- Cards renderizados dinamicamente via JS -->
            </div>
        </section>
    </main>

    <footer class="footer-site">
        <p>&copy; <span id="anoatual"></span> DoMendes Pizzaria — SP - Brasil</p>
        <p id="ultimaModificacao"></p>
    </footer>

</body>
</html>
